# WRITTEN, NOT RUN: Docker was not available on the machine this POC was built on.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assess
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assess"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  # api creates the schema + seeds users/rubric (idempotent) before serving; the worker waits for api to be healthy.
  api:
    build: .
    command: ["sh", "-c", "python -m app.bootstrap && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &env
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/assess
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-use-a-long-random-secret-32b}
      UPLOAD_DIR: /data/uploads
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  worker:
    build: .
    command: ["python", "-m", "app.queue.worker"]
    environment: *env
    depends_on:
      postgres: {condition: service_healthy}
      api: {condition: service_healthy}
    volumes: [uploads:/data/uploads]
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
